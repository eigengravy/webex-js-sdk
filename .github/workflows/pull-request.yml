name: Pull Request CI
run-name: ${{ github.actor }} is running Pull Request CI

on:
  pull_request_target:
    types: [opened, labeled, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  rid: ${{ github.run_id }}-${{ github.run_number }}
  SKIP_FLAKY_TESTS: ${{ secrets.SKIP_FLAKY_TESTS }}
  WEBEX_APPID_ORGID: ${{ secrets.WEBEX_APPID_ORGID }}
  WEBEX_APPID_SECRET: ${{ secrets.WEBEX_APPID_SECRET }}
  WEBEX_CLIENT_ID: ${{ secrets.WEBEX_CLIENT_ID }}
  WEBEX_CLIENT_SECRET: ${{ secrets.WEBEX_CLIENT_SECRET }}

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Validate Labels
        run: |
          HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO=${{ github.event.pull_request.base.repo.full_name }}
          FROM_BASE=0; [ "$HEAD_REPO" == "$BASE_REPO" ] && FROM_BASE=1

          HAS_VALIDATED_LABEL=${{ contains(github.event.pull_request.labels.*.name, 'validated') }}
          VALIDATED=0; [ "$HAS_VALIDATED_LABEL" == "true" ] && VALIDATED=1

          echo from base $FROM_BASE
          echo validated $VALIDATED

          if [[ $FROM_BASE == 1 || $VALIDATED == 1 ]]
          then
            echo 'pull request is validated, running tests'
            exit 0
          else
            echo 'pull request is not validated, exiting'
            exit 1
          fi


  initialize:
    name: Initialize Project
    needs: validate
    runs-on: ubuntu-latest

    outputs:
      lock-hash: ${{ steps.lock-hash.outputs.hash }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Write Environment Variables
        run: |
          touch ./.env
          echo "SKIP_FLAKY_TESTS=\"${{ secrets.SKIP_FLAKY_TESTS }}\"" >> ./.env
          echo "WEBEX_APPID_ORGID=\"${{ secrets.WEBEX_APPID_ORGID }}\"" >> ./.env
          echo "WEBEX_APPID_SECRET=\"${{ secrets.WEBEX_APPID_SECRET }}\"" >> ./.env
          echo "WEBEX_CLIENT_ID=\"${{ secrets.WEBEX_CLIENT_ID }}\"" >> ./.env
          echo "WEBEX_CLIENT_SECRET=\"${{ secrets.WEBEX_CLIENT_SECRET }}\"" >> ./.env

      - name: Cache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - id: validate-dependencies
        name: Validate Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - id: lock-hash
        name: Store Lock Hash
        run: echo "hash=$(echo ${{ hashFiles('./yarn.lock') }})" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: yarn

      - name: Validate Lock Hash
        run: |
          PREV_HASH=${{ steps.lock-hash.outputs.hash }}
          NEXT_HASH=${{ hashFiles('./yarn.lock') }}

          VALIDATED=0; [ "$PREV_HASH" == "$NEXT_HASH" ] && VALIDATED=1

          if [[ $VALIDATED == 1 ]]
          then
            echo 'lock file has been validated, proceeding'
            exit 0
          else
            echo 'lock file has changed after initialization'
            echo 'usually, updating and ammending the lock file in this pull request can resolve this issue'
            exit 1
          fi

      - name: Cache Dependencies
        uses: actions/cache@v3
        if: steps.validate-dependencies.outputs.cache-hit != 'true'
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

  build:
    name: Build Packages
    needs: initialize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Synchronize Packages
        run: yarn

      - name: Build Tools
        run: yarn workspaces foreach --from '@webex/*-tools' --topological-dev --parallel --verbose run build:src

      - name: Build Webex Core
        run: yarn workspace @webex/webex-core run build:src

      - name: Build Other Packages
        run: yarn workspaces foreach --parallel --topological --verbose run build:src

      - name: Cache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}


  generate-package-matrix:
    name: Determine Changed Packages
    needs: build
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.generate-package-matrix-changed.outputs.changed }}
      recursive: ${{ steps.generate-package-matrix-recursive.outputs.recursive }}

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Update Main Branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --unshallow

      - id: generate-package-matrix-recursive
        name: Generate Package Matrix
        run: echo "recursive=$(yarn package-tools list --private --recursive --since ${{ github.event.pull_request.base.sha }})" >> $GITHUB_OUTPUT

      - id: generate-package-matrix-changed
        name: Generate Package Matrix
        run: echo "changed=$(yarn package-tools list --private --since ${{ github.event.pull_request.base.sha }})" >> $GITHUB_OUTPUT

      - name: Display Package Matrix
        run: |
          echo "changed packages - ${{ steps.generate-package-matrix-changed.outputs.changed}}"
          echo "changed packages and dependents - ${{ steps.generate-package-matrix-recursive.outputs.recursive }}"


  test-browser:
    name: Test - Browser
    needs: generate-package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Test - Browser
        run: yarn workspaces foreach --verbose --exclude webex-js-sdk --include '${{ needs.generate-package-matrix.outputs.changed }}' run test:browser


  test-coverage:
    name: Test - Coverage
    needs: generate-package-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Test - Coverage
        run: yarn workspaces foreach --verbose --exclude webex-js-sdk --include '${{ needs.generate-package-matrix.outputs.recursive }}' run test:coverage


  test-integration:
    name: Test - Integration
    needs: generate-package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Build Packages
        run: yarn build:local

      - name: Test - Integration
        run: yarn workspaces foreach --verbose --exclude webex-js-sdk --include '${{ needs.generate-package-matrix.outputs.changed }}' run test:integration


  test-style:
    name: Test - Style
    needs: generate-package-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Test - Style
        run: yarn workspaces foreach --verbose --exclude webex-js-sdk --include '${{ needs.generate-package-matrix.outputs.recursive }}' run test:style

  test-syntax:
    name: Test - Syntax
    needs: generate-package-matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Test - Syntax
        run: yarn workspaces foreach --verbose --exclude webex-js-sdk --include '${{ needs.generate-package-matrix.outputs.recursive }}'  run test:syntax


  test-unit:
    name: Test - Unit
    needs: generate-package-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v3.7.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v3
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v3
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      - name: Test - Unit
        run: yarn workspaces foreach --verbose --exclude webex-js-sdk --include '${{ needs.generate-package-matrix.outputs.recursive }}' run test:unit

  # Playwright calling E2E (label-gated like widgets repo): add label `run_e2e` + touch @webex/calling in the matrix.
  test-e2e-calling:
    name: Test - Calling E2E (Playwright)
    needs: [build, generate-package-matrix]
    if: contains(needs.generate-package-matrix.outputs.recursive, '@webex/calling') && contains(toJson(github.event.pull_request.labels), 'run_e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Uncache Environment Variables
        uses: actions/cache@v4
        with:
          path: './.env'
          key: env-${{ env.rid }}

      - name: Uncache Dependencies
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: node-modules-${{ hashFiles('./yarn.lock') }}

      - name: Uncache Distributables
        uses: actions/cache@v4
        with:
          path: '**/dist'
          key: dist-${{ env.rid }}

      - name: Synchronize Packages
        run: yarn

      # calling/index.html loads ../calling.min.js from disk; samples:serve does not inject the dev bundle there.
      - name: Build sample bundles for browser tests
        run: yarn samples:build

      - name: Install Playwright browsers and OS dependencies
        run: yarn exec playwright install --with-deps chrome

      - name: Write Playwright test-user variables to .env
        run: |
          {
            echo "USER_1_EMAIL=\"${{ secrets.USER_1_EMAIL }}\""
            echo "USER_1_PASSWORD=\"${{ secrets.USER_1_PASSWORD }}\""
            echo "USER_1_PHONE_NUMBER=\"${{ secrets.USER_1_PHONE_NUMBER }}\""
            echo "USER_2_EMAIL=\"${{ secrets.USER_2_EMAIL }}\""
            echo "USER_2_PASSWORD=\"${{ secrets.USER_2_PASSWORD }}\""
            echo "USER_2_PHONE_NUMBER=\"${{ secrets.USER_2_PHONE_NUMBER }}\""
            echo "USER_3_EMAIL=\"${{ secrets.USER_3_EMAIL }}\""
            echo "USER_3_PASSWORD=\"${{ secrets.USER_3_PASSWORD }}\""
            echo "USER_3_PHONE_NUMBER=\"${{ secrets.USER_3_PHONE_NUMBER }}\""
            echo "USER_4_EMAIL=\"${{ secrets.USER_4_EMAIL }}\""
            echo "USER_4_PASSWORD=\"${{ secrets.USER_4_PASSWORD }}\""
            echo "USER_4_PHONE_NUMBER=\"${{ secrets.USER_4_PHONE_NUMBER }}\""
            echo "USER_5_EMAIL=\"${{ secrets.USER_5_EMAIL }}\""
            echo "USER_5_PASSWORD=\"${{ secrets.USER_5_PASSWORD }}\""
            echo "USER_5_PHONE_NUMBER=\"${{ secrets.USER_5_PHONE_NUMBER }}\""
            echo "USER_6_EMAIL=\"${{ secrets.USER_6_EMAIL }}\""
            echo "USER_6_PASSWORD=\"${{ secrets.USER_6_PASSWORD }}\""
            echo "USER_6_PHONE_NUMBER=\"${{ secrets.USER_6_PHONE_NUMBER }}\""
            echo "USER_1_INT_EMAIL=\"${{ secrets.USER_1_INT_EMAIL }}\""
            echo "USER_1_INT_PASSWORD=\"${{ secrets.USER_1_INT_PASSWORD }}\""
            echo "USER_2_INT_EMAIL=\"${{ secrets.USER_2_INT_EMAIL }}\""
            echo "USER_2_INT_PASSWORD=\"${{ secrets.USER_2_INT_PASSWORD }}\""
            echo "USER_3_INT_EMAIL=\"${{ secrets.USER_3_INT_EMAIL }}\""
            echo "USER_3_INT_PASSWORD=\"${{ secrets.USER_3_INT_PASSWORD }}\""
            echo "USER_4_INT_EMAIL=\"${{ secrets.USER_4_INT_EMAIL }}\""
            echo "USER_4_INT_PASSWORD=\"${{ secrets.USER_4_INT_PASSWORD }}\""
            echo "USER_5_INT_EMAIL=\"${{ secrets.USER_5_INT_EMAIL }}\""
            echo "USER_5_INT_PASSWORD=\"${{ secrets.USER_5_INT_PASSWORD }}\""
            echo "USER_6_INT_EMAIL=\"${{ secrets.USER_6_INT_EMAIL }}\""
            echo "USER_6_INT_PASSWORD=\"${{ secrets.USER_6_INT_PASSWORD }}\""
            echo "USER_1_INT_PHONE_NUMBER=\"${{ secrets.USER_1_INT_PHONE_NUMBER }}\""
            echo "USER_2_INT_PHONE_NUMBER=\"${{ secrets.USER_2_INT_PHONE_NUMBER }}\""
            echo "USER_3_INT_PHONE_NUMBER=\"${{ secrets.USER_3_INT_PHONE_NUMBER }}\""
            echo "USER_4_INT_PHONE_NUMBER=\"${{ secrets.USER_4_INT_PHONE_NUMBER }}\""
            echo "USER_5_INT_PHONE_NUMBER=\"${{ secrets.USER_5_INT_PHONE_NUMBER }}\""
            echo "USER_6_INT_PHONE_NUMBER=\"${{ secrets.USER_6_INT_PHONE_NUMBER }}\""
          } >> ./.env

      - name: Test - Calling E2E
        run: yarn workspace @webex/calling run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: calling-playwright-${{ github.run_id }}
          path: |
            packages/calling/playwright-report/**
            packages/calling/test-results/**
          retention-days: 10
